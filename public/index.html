<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Study: Your Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Poppins:wght@400;500;600&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--page:#e3f3ea;--bg:#f5fbf7;--surface:#fff;--ink:#10261a;--muted:#5a7466;--line:#dcebe2;--accent:#16874a;--soft:#e2f5ea;--on:#fff;--bad:#d9534f;--side1:#27a862;--side2:#117040;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#0b1510;--surface:#121f18;--ink:#e8f5ec;--muted:#8fb09b;--line:#223a2c;--accent:#4ade80;--soft:#1b3326;--on:#052e16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1510;--surface:#121f18;--ink:#e8f5ec;--muted:#8fb09b;--line:#223a2c;--accent:#4ade80;--soft:#1b3326;--on:#052e16;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--surface);border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:5}
.bar{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo svg{width:32px;height:32px;color:var(--accent);flex:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
h1{font-size:1.7rem;margin:0;color:var(--accent)}h2{font-size:1.05rem;margin:0 0 12px}
.sub{color:var(--muted);margin:2px 0 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font-size:1.9rem;font-weight:800;line-height:1.1;color:var(--accent)}.stat span,.muted{color:var(--muted);font-size:.88rem}
.meter{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--accent);transition:width .35s}
button.b,.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
button.b.alt{background:var(--soft);color:var(--accent)}button.b.red{background:none;color:var(--bad);border:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;max-width:100%}
textarea{width:100%;min-height:150px;resize:vertical}
label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);margin-bottom:12px}label input{width:100%}
.subj{cursor:pointer;transition:border-color .15s}.subj:hover{border-color:var(--accent)}.subj h3{margin:0 0 2px}
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.unit{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.unit input{width:18px;height:18px;accent-color:var(--accent);padding:0}.unit span{flex:1}.unit.done span{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer}.x:hover{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--muted)}
.chart i{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font-size:.75rem;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;cursor:pointer;position:relative}
.cal button.e{visibility:hidden}.cal button.t{border-color:var(--accent)}.cal button.sel{background:var(--soft)}
.cal button u{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}.cal button u.ex{background:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--on);border:0;border-radius:99px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 24px -8px rgba(21,128,61,.6);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.fab:hover{transform:translateY(-4px)}
.chat{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:20;width:min(390px,calc(100vw - 36px));height:min(540px,calc(100vh - 140px));background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 24px 48px -16px rgba(0,0,0,.3);overflow:hidden}
.chat[hidden]{display:none}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.ch b{margin-right:auto}.ch select{max-width:130px;padding:5px 8px}
.cm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.m.ai{background:var(--soft);align-self:flex-start}.m.me{background:var(--accent);color:var(--on);align-self:flex-end}
.ln{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start;font-size:.8rem}
.ln a{color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:3px 10px;text-decoration:none;font-weight:600}.ln a:hover{background:var(--soft)}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.cf input{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(380px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
.link{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:10px;overflow-wrap:anywhere}
.card,button.b,nav button,.cal button,.unit,.link,.logo svg{transition:transform .28s cubic-bezier(.2,.8,.3,1),box-shadow .28s,border-color .2s,background .2s}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 28px -12px rgba(21,128,61,.4);border-color:var(--accent)}
button.b:hover{transform:translateY(-3px);box-shadow:0 10px 18px -8px rgba(21,128,61,.55)}
button.b:active{transform:translateY(0);box-shadow:none}
nav button:hover{transform:translateY(-2px);background:var(--soft);color:var(--accent)}
.cal button:not(.e):hover{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 14px -8px rgba(21,128,61,.5);border-color:var(--accent)}
.unit:hover,.link:hover{transform:translateY(-2px)}
.logo:hover svg{transform:translateY(-3px) rotate(-6deg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover,button.b:hover,nav button:hover,.cal button:hover,.unit:hover,.link:hover,.logo:hover svg{transform:none}}
.yrs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.yrs a{color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:3px 12px;text-decoration:none;font-weight:700;font-size:.85rem;transition:transform .2s,background .2s}
.yrs a:hover{background:var(--soft);transform:translateY(-2px)}
a.btn{text-decoration:none;display:inline-block}
.qo{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.qo:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);background:var(--soft)}
.qo:disabled{cursor:default}.qo.ok{border-color:#22c55e;background:rgba(34,197,94,.22)}.qo.no{border-color:var(--bad);background:rgba(217,83,79,.16)}
@media (max-width:720px){.g2{grid-template-columns:1fr}.sp{margin-left:0}}
/* planner redesign */
html{scroll-behavior:smooth}
body{background:var(--page)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;max-width:1380px;margin:18px auto;padding:18px;background:var(--bg);border-radius:32px;box-shadow:0 30px 60px -30px rgba(16,80,45,.35)}
.side{position:sticky;top:18px;align-self:start;height:calc(100vh - 72px);min-height:560px;background:linear-gradient(175deg,var(--side1),var(--side2));border-radius:26px;padding:26px 16px 20px;display:flex;flex-direction:column;color:#fff;box-shadow:0 24px 40px -24px rgba(10,80,40,.7)}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px;font-weight:800;font-size:1.05rem}
.mark{width:78px;height:78px;border-radius:24px;border:0;background:linear-gradient(150deg,#74e3a6,#1c9a57);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 14px 26px -12px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.mark:hover{transform:translateY(-3px) rotate(-3deg)}.mark svg{width:46px;height:46px}
.mark.flip svg{animation:pg .7s cubic-bezier(.4,0,.2,1)}
@keyframes pg{to{transform:rotateY(360deg)}}
.side nav{flex-direction:column;flex-wrap:nowrap;gap:6px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:rgba(255,255,255,.85);padding:12px 14px;border-radius:14px;font-size:.95rem}
.side nav button svg{width:20px;height:20px;flex:none}
.side nav button:hover{background:rgba(255,255,255,.16);color:#fff;transform:translateX(4px)}
.side nav button.on,.side nav button.on:hover{background:#fff;color:var(--accent);box-shadow:0 10px 20px -12px rgba(0,0,0,.45);transform:none}
.out{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;background:rgba(255,255,255,.14);border:0;color:#fff;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s}
.out:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}.out svg{width:20px;height:20px}
.content{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 20px}
.top h2{margin:0;font-size:1.3rem}.top small{color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);padding:6px 16px 6px 6px;border-radius:999px;box-shadow:0 8px 22px -14px rgba(16,80,45,.45)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#74e3a6,#16874a);color:#fff;display:grid;place-items:center;font-weight:800;text-transform:uppercase}
.who b{display:block;line-height:1.1;font-size:.9rem}.who small{color:var(--muted);font-size:.75rem}
.content main{max-width:none;margin:0;padding:0 0 60px}
.content main h1{color:var(--ink);font-size:1.6rem}
#app.in{animation:vin .5s cubic-bezier(.2,.8,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{border-radius:20px;box-shadow:0 12px 30px -20px rgba(16,80,45,.35)}
button.b,.btn,a.btn,.fab{border-radius:999px}
input,select,textarea{border-radius:12px}
.banner{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:10px;border-radius:26px;padding:28px 36px;margin-bottom:8px;background:linear-gradient(120deg,#117040,#2fb46d);color:#fff;position:relative;overflow:hidden;box-shadow:0 24px 40px -24px rgba(17,112,64,.8)}
.banner::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-110px}
.bt{position:relative}.bd{display:inline-block;font-size:.8rem;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px}
.content .banner h1{color:#fff;font-size:2rem;margin:12px 0 6px}
.banner p{margin:0 0 16px;color:rgba(255,255,255,.88)}
.banner button.b.light{background:#fff;color:var(--accent)}
.bimg{position:relative;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 66%)}.bimg svg{width:100%;max-height:210px;display:block}
.sec{margin:22px 0 12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.card.stat{text-align:center;padding:22px 16px}
.stat .si{width:58px;height:58px;border-radius:18px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 10px}.si svg{width:28px;height:28px}
.card.stat b{color:var(--ink)}
.subj{background:linear-gradient(160deg,var(--surface),var(--soft))}
.vbtn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;padding:7px 22px;border-radius:999px;font-weight:700;font-size:.85rem}
.up{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s}
.up:hover{background:var(--soft);transform:translateX(3px)}
.up .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}.up .dot.ex{background:var(--bad)}
.up b{display:block;font-size:.92rem}
button.b,.side nav button,.subj,.qo,.up,.out,.lp-go{position:relative;overflow:hidden}.fab{overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;pointer-events:none;transform:scale(0);animation:rp .65s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
button.b:active,.side nav button:active,.subj:active,.out:active,.up:active{transform:scale(.97)}
:root[data-theme="dark"]{--page:#07100b;--side1:#176b3d;--side2:#0d4528}
@media (max-width:1100px){.dgrid{grid-template-columns:1fr}}
@media (max-width:980px){.shell{grid-template-columns:1fr;margin:0;border-radius:0;padding:12px}.side{position:static;height:auto;min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border-radius:20px}.brand{flex-direction:row;margin:0}.mark{width:48px;height:48px;border-radius:15px}.mark svg{width:30px;height:30px}.side nav{flex-direction:row;overflow-x:auto;order:3;width:100%}.side nav button{width:auto;white-space:nowrap}.out{margin:0 0 0 auto;width:auto}.banner{grid-template-columns:1fr}.bimg{display:none}.grid3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#app.in,.mark.flip svg,.rp{animation:none!important}html{scroll-behavior:auto}}
/* login split screen */
#lp{position:fixed;inset:0;z-index:100;overflow:auto;background:#e3f3ea;padding:18px;font-family:Poppins,Manrope,system-ui,sans-serif;color:#10261a;line-height:1.4}
#lp *{box-sizing:border-box}#lp [hidden]{display:none!important}
.lp-card{min-height:100%;display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(16,80,45,.45)}
.lp-left{padding:40px 64px 36px;display:flex;flex-direction:column;background:#fff}
.lp-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.lp-brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,#74e3a6,#16874a);display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}.lp-brand i svg{width:24px;height:24px}
.lp-fw{margin:auto 0;width:100%;max-width:390px;padding:30px 0}
#lp h1{font-size:2.5rem;font-weight:600;margin:0 0 6px;color:#10261a;letter-spacing:-.5px}
.lp-sub{margin:0 0 30px;color:#5a7466;font-size:.92rem}
.lp-f{position:relative;margin-bottom:20px}
#lp .lp-f input{width:100%;border:0;border-bottom:1.5px solid #cfe3d6;border-radius:0;background:transparent;font:400 .95rem Poppins,sans-serif;color:#10261a;padding:12px 40px 12px 2px;outline:none;transition:border-color .25s}
#lp .lp-f input:focus{border-bottom-color:#16874a}#lp .lp-f input::placeholder{color:#8aa394}
.lp-eye{position:absolute;right:0;top:8px;width:34px;height:34px;border:0;background:none;color:#7c9686;cursor:pointer;border-radius:50%;display:grid;place-items:center;transition:color .2s,background .2s}
.lp-eye:hover,.lp-eye.on{color:#16874a;background:#e2f5ea}.lp-eye svg{width:20px;height:20px}
.lp-forgot{display:inline-block;font-size:.85rem;color:#16874a;text-decoration:none;margin-bottom:26px}.lp-forgot:hover{text-decoration:underline}
#lp button.lp-go{width:100%;border:0;background:#16874a;color:#fff;font:500 1rem Poppins,sans-serif;padding:15px 24px;border-radius:999px;cursor:pointer;box-shadow:0 14px 24px -14px rgba(22,135,74,.9);transition:transform .25s,background .2s,box-shadow .25s}
#lp button.lp-go:hover{background:#0f6f3b;transform:translateY(-2px)}
#lp-msg{min-height:22px;font-size:.85rem;margin:14px 0 0;line-height:1.45;color:#5a7466}#lp-msg.err{color:#d23c3c}#lp-msg.ok{color:#0f6f3b;font-weight:500}
.lp-bottom{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.88rem;color:#5a7466}
#lp button.lp-alt{border:0;background:#e2f5ea;color:#0f6f3b;font:500 .88rem Poppins,sans-serif;padding:9px 22px;border-radius:999px;cursor:pointer;transition:background .2s,transform .2s}
#lp button.lp-alt:hover{background:#cdeedb;transform:translateY(-2px)}
.lp-right{position:relative;background:#16874a;color:#fff;padding:44px 52px 36px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.lp-b1,.lp-b2{position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}.lp-b1{width:340px;height:340px;right:-110px;top:-120px}.lp-b2{width:260px;height:260px;left:-90px;bottom:-90px}
.lp-hero{position:relative}
#lp h2{margin:0;font-size:clamp(2.2rem,4.2vw,3.5rem);line-height:1.08;font-weight:300;letter-spacing:-.5px}#lp h2 span{display:block;font-weight:600}
.lp-hero p{margin:14px 0 0;font-size:.95rem;color:rgba(255,255,255,.88)}
.lp-art{position:relative;display:flex;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 66%)}.lp-art svg{width:100%;max-width:500px;height:auto;display:block}
@media(max-width:860px){#lp{padding:0}.lp-card{grid-template-columns:1fr;border-radius:0}.lp-right{order:-1;padding:28px 24px 8px}.lp-art svg{max-width:240px}.lp-left{padding:28px 24px}.lp-fw{padding:24px 0}}
</style>

(function(){
var $=function(i){return document.getElementById(i)},msg=$('lp-msg'),mode='login';
function rd(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function say(t,c){msg.textContent=t;msg.className=c||''}
async function hash(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
var ses=rd('sp_session');
if(ses&&ses.user){$('lp').hidden=true;var wn=$('wn'),av=$('av'),td=$('tdate');if(wn)wn.textContent=ses.user;if(av)av.textContent=ses.user.charAt(0);if(td)td.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}
else{document.documentElement.style.overflow='hidden'}
$('lpo').addEventListener('click',function(){try{localStorage.removeItem('sp_session')}catch(e){}location.reload()});
function setMode(m){
  mode=m;var s=m==='signup';
  $('lp-h').textContent=s?'Sign up':'Login';
  $('lp-s').textContent=s?'Create your account to start planning':'Enter your account details';
  $('lp-cw').hidden=!s;$('lp-forgot').hidden=s;
  $('lp-go').textContent=s?'Create account':'Login';
  $('lp-q').textContent=s?'Already have an account?':"Don't have an account?";
  $('lp-sw').textContent=s?'Login':'Sign up';
  $('lp-pass').autocomplete=s?'new-password':'current-password';
  say('');
}
$('lp-sw').addEventListener('click',function(){setMode(mode==='login'?'signup':'login')});
$('lp-eye').addEventListener('click',function(){
  var show=$('lp-pass').type==='password';
  $('lp-pass').type=show?'text':'password';$('lp-pass2').type=show?'text':'password';
  $('lp-eye').setAttribute('aria-label',show?'Hide password':'Show password');$('lp-eye').classList.toggle('on',show);
});
$('lp-forgot').addEventListener('click',function(e){e.preventDefault();say('Password reset is not available yet because accounts are stored only in this browser. Sign up with a new username to continue.','')});
$('lp-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var name=$('lp-user').value.trim(),key=name.toLowerCase().replace(/[^a-z0-9_-]/g,'_'),pw=$('lp-pass').value;
  if(!name||pw.length<4){say('Enter a username and a password of at least 4 characters.','err');return}
  var users=rd('sp_users')||{},h=await hash(pw),now=new Date().toISOString(),note;
  if(mode==='signup'){
    if($('lp-pass2').value!==pw){say("Passwords don't match. Check both fields.",'err');return}
    if(users[key]){say('That username is already taken. Try another or log in.','err');return}
    users[key]={username:name,hash:h,created:now,lastLogin:now,logins:1};note='Account created. Welcome, '+name+'!';
  }else{
    if(!users[key]){say('No account found for that username. Sign up first.','err');return}
    if(users[key].hash!==h){say('Wrong password. Try again.','err');return}
    users[key].lastLogin=now;users[key].logins=(users[key].logins||0)+1;note='Welcome back, '+users[key].username+'!';
  }
  if(!(wr('sp_users',users)&&wr('sp_session',{user:users[key].username,key:key,at:now}))){say('This browser blocked saving your login. Allow site data and try again.','err');return}
  say(note,'ok');$('lp-go').disabled=true;$('lp-go').textContent='Opening your planner...';setTimeout(function(){location.reload()},600);
});
})();
</script>

  else{title=QB[idx][0];pool=shuf(QB[idx][1].map(function(r){return{q:r[0],o:r[1],a:r[2]}}))}

      qz.done=true;var p=Math.round(qz.score/qz.qs.length*100);
      S.best=S.best||{};if(S.best[qz.title]==null||p>S.best[qz.title])S.best[qz.title]=p;save();

function stopT(){clearInterval(tmr);tmr=null}
function act(a){
  var s;
  if(a==='addSub'){$('fSub').reset();$('dSub').showModal()}
  else if(a==='addUnit'){$('fUnit').reset();$('dUnit').showModal()}
  else if(a==='log'){var v=parseFloat($('lg').value);if(v>0){S.log[today]=Math.round(((S.log[today]||0)+v)*100)/100;save();render()}}
  else if(a==='start'){
    if(tmr){stopT();render();return}
    if(left<=0||left===1800&&false)left=(parseInt($('mins').value)||30)*60;
    tmr=setInterval(function(){left--;tick();if(left<=0){stopT();var h=(parseInt($('mins')&&$('mins').value)||30)/60;S.log[today]=Math.round(((S.log[today]||0)+h)*100)/100;save();left=1800;render()}},1000);render()}
  else if(a==='reset'){stopT();left=(parseInt($('mins').value)||30)*60;render()}
  else if(a==='delSub'){if(confirm('Delete this subject and its units?')){S.subjects=S.subjects.filter(function(x){return x.id!=cur});save();view='dash';render()}}
  else if(a==='saveNote'){s=sub(rsub);s.notes=$('nt').value;save();$('nt').style.borderColor='var(--accent)'}
  else if(a==='addLink'){s=sub(rsub);var l=$('lk').value.trim();if(l){s.links.push(l);save();render()}}
  else if(a==='saveProf'){S.name=$('pn').value.trim();S.goal=Math.max(1,parseInt($('pg').value)||4);save();render()}
  else if(a==='wipe'){if(confirm('Reset all data?')){S={name:'',goal:4,theme:S.theme,log:{},subjects:[]};save();render()}}
}

<button class="fab" id="fab" aria-label="Open AI study helper" aria-expanded="false">💬 Ask AI</button>
<section class="chat" id="chat" hidden aria-label="AI study helper">
  <div class="ch"><b>AI study helper</b><select id="csub" aria-label="Subject"></select><button class="x" id="cx" aria-label="Close chat">×</button></div>
  <div class="cm" id="cm" aria-live="polite"></div>
  <form class="cf" id="cf"><input id="ci" placeholder="Ask any question…" maxlength="500" autocomplete="off" required><button class="b" type="submit">Send</button></form>
</section>

<script>
(function(){
var g=function(id){return document.getElementById(id)},hist=[],busy=false,init=false;
function subjects(){try{return JSON.parse(localStorage.getItem(window.__SS_KEY||'smart-study-v1')).subjects.map(function(s){return s.name})}catch(e){return[]}}
function fillSel(){var s=g('csub'),v=s.value;s.innerHTML='';var o=document.createElement('option');o.value='';o.textContent='Any subject';s.appendChild(o);
  subjects().forEach(function(n){var p=document.createElement('option');p.value=n;p.textContent=n;s.appendChild(p)});s.value=v}
function add(cls,text){var d=document.createElement('div');d.className='m '+cls;d.textContent=text;g('cm').appendChild(d);g('cm').scrollTop=g('cm').scrollHeight;return d}
function links(list){
  var d=document.createElement('div');d.className='ln';
  list.forEach(function(l){var a=document.createElement('a');a.href=l[1];a.target='_blank';a.rel='noopener';a.textContent=l[0];d.appendChild(a)});
  g('cm').appendChild(d);g('cm').scrollTop=g('cm').scrollHeight}
function toggle(open){
  g('chat').hidden=!open;g('fab').setAttribute('aria-expanded',open);
  if(open){fillSel();if(!init){init=true;add('ai','Hi! Ask me anything about your subjects: explain a topic, solve a problem, or check an answer. I can’t browse the web live, so each answer has a Google link to look it up.')}g('ci').focus()}
}
g('fab').addEventListener('click',function(){toggle(g('chat').hidden)});
g('cx').addEventListener('click',function(){toggle(false);g('fab').focus()});
g('cf').addEventListener('submit',async function(e){
  e.preventDefault();var q=g('ci').value.trim();if(!q||busy)return;
  g('ci').value='';add('me',q);busy=true;
  var el=add('ai','Thinking…');
  hist.push({role:'user',content:q});
  try{
    var res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,subject:g('csub').value})});
    var data=await res.json();
    if(!res.ok)throw new Error(data.error||'Request failed');
    el.textContent=data.text;hist.push({role:'assistant',content:data.text});
    var l=data.sources.map(function(x){return [x.title.slice(0,40),x.url]});
    links(l.length?l:[['Search Google','https://www.google.com/search?q='+encodeURIComponent(q)]]);
  }catch(err){
    hist.pop();el.textContent=err.message||'Something went wrong. Try again.';
    links([['Search Google','https://www.google.com/search?q='+encodeURIComponent(q)]]);
  }finally{busy=false}
});
})();
</script>
<script>
document.addEventListener('pointerdown',function(e){var t=e.target.closest('button.b,.side nav button,.subj,.fab,.qo,.up,.out,.lp-go');if(!t||t.disabled)return;var r=t.getBoundingClientRect(),z=Math.max(r.width,r.height)*1.6,d=document.createElement('span');d.className='rp';d.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(e.clientX-r.left-z/2)+'px;top:'+(e.clientY-r.top-z/2)+'px';t.appendChild(d);setTimeout(function(){d.remove()},700)});
(function(){var m=document.getElementById('mark');m.addEventListener('click',function(){m.classList.remove('flip');void m.offsetWidth;m.classList.add('flip')})})();
</script>
</body>
